<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e2014" />
    <title>هاشم للطيب والعطور</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#6b5a45;background:#faf6ee">جاري التحميل…</div>
    </div>
    <noscript><div style="padding:24px;font-family:sans-serif">يلزم تفعيل JavaScript لتشغيل النظام.</div></noscript>
    <script>
      // شبكة أمان: إن لم يقلع التطبيق خلال 8 ثوانٍ يظهر السبب بدل الشاشة البيضاء
      (function () {
        var errs = [];
        function show() {
          if (window.__APP_MOUNTED__) return;
          var b = document.getElementById('boot'); if (!b) return;
          b.style.flexDirection = 'column'; b.style.padding = '24px'; b.style.textAlign = 'center';
          b.innerHTML = '<b style="color:#2e2014;font-size:18px">تعذّر تشغيل النظام</b><p>حدّث الصفحة. إن تكرر الأمر أرسل النص التالي للمطوّر:</p><pre dir="ltr" style="max-width:90vw;white-space:pre-wrap;background:#f5efe2;padding:12px;border-radius:10px;font-size:12px"></pre>';
          b.querySelector('pre').textContent = errs.join('\n') || 'no error captured (check Vercel build output / MIME type)';
        }
        window.addEventListener('error', function (e) { errs.push(String(e.message || e.error || 'script error') + (e.filename ? ' @ ' + e.filename : '')); setTimeout(show, 300); }, true);
        window.addEventListener('unhandledrejection', function (e) { errs.push('Promise: ' + String(e.reason)); });
        setTimeout(show, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
